name: Deploy to GitHub Pages

# Deploy on pushes to the long-lived branches: `main` (so merges auto-deploy)
# and the feature branch (so in-progress work can be previewed). Workflow can
# also be run manually from the Actions tab if a rollback or reroll is needed.
on:
  push:
    branches:
      - main
      - claude/oscilloscope-text-3d-viz-9mmt4
  workflow_dispatch:

# Only one deploy in flight at a time, and let a newer push cancel an older
# run so the latest commit always wins (no stale build clobbering a newer one).
concurrency:
  group: pages-deploy
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Publish dist to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
